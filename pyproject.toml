[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-gate"
version = "0.1.0"
description = "A CLI that gives a hard GO/NO-GO on a release by enforcing a release-readiness checklist."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ramenprotokol" }]
keywords = ["release", "ci", "deployment", "checklist", "gate", "devops", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Environment :: Console",
]
dependencies = ["PyYAML==6.0.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov>=5.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/ramenprotokol/delivery-gate"
Repository = "https://github.com/ramenprotokol/delivery-gate"
Issues = "https://github.com/ramenprotokol/delivery-gate/issues"
Changelog = "https://github.com/ramenprotokol/delivery-gate/blob/main/CHANGELOG.md"

[project.scripts]
delivery-gate = "delivery_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# The design notes quote code as it was planned; do not reformat them.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
